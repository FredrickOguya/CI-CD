name: Deployment pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependancies
        run: npm install

      - name: Check style
        run: npm run eslint

      - name: Run npm test
        run: npm run test
      
  build_end_e2e:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependancies
        run: npm install

      - name: Run npm build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run Paaywright tests
        run: npm run test:e2e
  
  deploy:
    needs: build_end_e2e
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  tag_release:
    needs: [deploy]
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with: 
          fetch-depth: 0

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  notify_success:
    needs: [deploy]
    if: ${{ success() && github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord about successfull deployment
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Deployment successful"
          description: "A new version has been deployed to Render"

  notify_failure:
    needs: [tests, build_end_e2e, deploy, tag_release]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord about failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Build or deployment failed"
          description: |
            a job in deployment pipline has failed.
            commit SHA: ${{ github.sha }}
            Commit message: ${{ github.event.head_commit.message }}
            Triggered by: ${{ github.actor }}
            workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}