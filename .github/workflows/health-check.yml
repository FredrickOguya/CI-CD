name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed application
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://fullstackopen-ci-cd-w3zm.onrender.com/
          max-attempts: 3
          retry-delay: 10s
          retry-all: false